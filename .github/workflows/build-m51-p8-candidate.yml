name: Build LibrePods M51 p8 experimental test APK

on:
  workflow_dispatch:
  push:
    branches: [m51-root-cause-audit]
    paths:
      - .github/workflows/build-m51-p8-candidate.yml

permissions:
  contents: read

jobs:
  build-p8-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct existing LibrePods M51 source with v9 and p0-p8
        shell: bash
        run: |
          set -euo pipefail
          test -s LibrePods-M51-v4-pronto-para-compilar.zip
          unzip -q LibrePods-M51-v4-pronto-para-compilar.zip -d source
          python3 source/LibrePods-M51-v4/tools/verify-m51-source.py
          python3 scripts/fix-m51-unknown-battery.py source/LibrePods-M51-v4
          python3 scripts/m51-v5-public-ble-preview.py source/LibrePods-M51-v4
          python3 scripts/m51-v6-ble-continuo.py source/LibrePods-M51-v4
          git apply --directory=source/LibrePods-M51-v4 scripts/m51-v7.patch
          python3 scripts/m51-v8-lifecycle-ble.py source/LibrePods-M51-v4
          python3 scripts/m51-v9-ble-recovery.py source/LibrePods-M51-v4
          python3 scripts/m51-p0-source-fixes.py source/LibrePods-M51-v4
          python3 scripts/m51-p1-l2cap-guard.py source/LibrePods-M51-v4
          python3 scripts/m51-p2-visible-diagnostics.py source/LibrePods-M51-v4
          python3 scripts/m51-p3-l2cap-quiet.py source/LibrePods-M51-v4
          python3 scripts/m51-p4-ble-recovery.py source/LibrePods-M51-v4
          python3 scripts/m51-p5-compose-state.py source/LibrePods-M51-v4
          python3 scripts/m51-p6-service-fallback.py source/LibrePods-M51-v4
          python3 scripts/m51-p7-single-scanner.py source/LibrePods-M51-v4
          python3 scripts/m51-p8-evidence-fixes.py source/LibrePods-M51-v4
          python3 scripts/verify-m51-audit.py source/LibrePods-M51-v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify unit tests then assemble experimental debug APK
        working-directory: source/LibrePods-M51-v4/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signed APK, provenance, and hash
        shell: bash
        run: |
          set -euo pipefail
          APK=source/LibrePods-M51-v4/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/LibrePods-M51-v9-p8-EXPERIMENTAL-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > output/APK-SIGNATURE.txt
          (cd output && sha256sum LibrePods-M51-v9-p8-EXPERIMENTAL-debug.apk > SHA256SUMS.txt)
          printf 'EXPERIMENTAL: not validated on M51 AirPods Pro 3. No ANC, AACP or in-ear pause claims.\n' > output/READ-FIRST.txt
          printf 'Git commit: %s\nPipeline: source v4 + v5..v9 + p0..p8\n' "$GITHUB_SHA" >> output/READ-FIRST.txt
      - name: Upload one experimental APK for physical tests only
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-M51-v9-p8-EXPERIMENTAL-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
