name: Build isolated LibrePods M51 p9 sidecar (EXPERIMENTAL)
on:
  push:
    branches: [m51-p9-side-by-side-lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-v8-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original LibrePods through v8
        shell: bash
        run: |
          set -euo pipefail
          unzip -q LibrePods-M51-v4-pronto-para-compilar.zip -d source
          python3 source/LibrePods-M51-v4/tools/verify-m51-source.py
          python3 scripts/fix-m51-unknown-battery.py source/LibrePods-M51-v4
          python3 scripts/m51-v5-public-ble-preview.py source/LibrePods-M51-v4
          python3 scripts/m51-v6-ble-continuo.py source/LibrePods-M51-v4
          git apply --directory=source/LibrePods-M51-v4 scripts/m51-v7.patch
          python3 scripts/m51-v8-lifecycle-ble.py source/LibrePods-M51-v4
      - name: Preserve v9 Bluetooth recovery patch
        run: python3 scripts/m51-v9-ble-recovery.py source/LibrePods-M51-v4
      - name: Apply audited auto-battery and audio fixes (no version bump)
        run: python3 scripts/m51-p0-source-fixes.py source/LibrePods-M51-v4
      - name: Prevent automatic L2CAP spam on rootless Android 12
        run: python3 scripts/m51-p1-l2cap-guard.py source/LibrePods-M51-v4
      - name: Show diagnostic directly on home screen
        run: python3 scripts/m51-p2-visible-diagnostics.py source/LibrePods-M51-v4
      - name: Gate ALL Android 12 automatic L2CAP attempts and quiet notices
        run: python3 scripts/m51-p3-l2cap-quiet.py source/LibrePods-M51-v4
      - name: Recover Samsung Android 12 BLE scanner and broken filters
        run: python3 scripts/m51-p4-ble-recovery.py source/LibrePods-M51-v4
      - name: Fix Compose service status and preferences observer lifecycle
        run: python3 scripts/m51-p5-compose-state.py source/LibrePods-M51-v4
      - name: Show home-screen recovery if Bluetooth service fails
        run: python3 scripts/m51-p6-service-fallback.py source/LibrePods-M51-v4
      - name: Prevent orphan BLE callbacks when switching scan modes
        run: python3 scripts/m51-p7-single-scanner.py source/LibrePods-M51-v4
      - name: Bound scanner retries and preserve unknown lid state
        run: python3 scripts/m51-p8-evidence-fixes.py source/LibrePods-M51-v4
      - name: Deliver M51 Android 12 controller batches with cancellable flush
        run: python3 scripts/m51-p9-batch-delivery.py source/LibrePods-M51-v4
      - name: Prepare separate p9 test package without replacing p8
        run: python3 scripts/m51-p9-sidecar.py source/LibrePods-M51-v4
      - name: Check reconstructed callback and battery integration
        run: python3 scripts/verify-m51-audit.py source/LibrePods-M51-v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK platform 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run original Kotlin and p9 unit tests for sidecar
        working-directory: source/LibrePods-M51-v4/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble isolated debug APK after passing tests
        working-directory: source/LibrePods-M51-v4/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify isolated package, manifest, signing and 41 tests
        shell: bash
        run: |
          set -euo pipefail
          APK=source/LibrePods-M51-v4/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p output
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > output/APK-BADGING.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > output/APK-MANIFEST-TREE.txt
          grep -F "package: name='me.kavishdevar.librepods.m51test.p9sidecar'" output/APK-BADGING.txt
          grep -F "application-label:'LibrePods M51 p9 (paralelo)'" output/APK-BADGING.txt
          grep -F "me.kavishdevar.librepods.m51test.p9sidecar.provider" output/APK-MANIFEST-TREE.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > output/APK-SIGNATURE.txt
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('source/LibrePods-M51-v4/android/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          total = sum(int(ET.parse(f).getroot().attrib['tests']) for f in files)
          failures = sum(int(ET.parse(f).getroot().attrib.get('failures','0'))+int(ET.parse(f).getroot().attrib.get('errors','0')) for f in files)
          print(f'JUnit: {total} tests, {failures} failures/errors')
          assert total == 41 and failures == 0, 'Expected all 41 p9 regressions to pass'
          PY
          cp "$APK" output/LibrePods-M51-p9-SIDECAR-EXPERIMENTAL-debug.apk
          (cd output && sha256sum LibrePods-M51-p9-SIDECAR-EXPERIMENTAL-debug.apk > SHA256SUMS.txt)
          printf 'EXPERIMENTAL: separate package, NOT a p8 update. Different app data and permissions. Do not use alongside an active p8 BLE scanner; stop p8 first. No hardware validation. No automatic installation.\nGit commit %s\n' "$GITHUB_SHA" > output/READ-FIRST.txt
      - name: Upload user-approved test candidate (not installed)
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-M51-p9-SIDECAR-EXPERIMENTAL-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m51-audit-junit-reports
          path: |
            source/LibrePods-M51-v4/android/app/build/reports/tests/
            source/LibrePods-M51-v4/android/app/build/test-results/
          if-no-files-found: ignore
      - name: Package reconstructed source for inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          tar -C source/LibrePods-M51-v4/android -czf audit/m51-v8-reconstructed-android-source.tar.gz --exclude=build --exclude=.gradle app/src app/build.gradle.kts settings.gradle.kts gradle.properties gradle/libs.versions.toml app/src/main/AndroidManifest.xml
          sha256sum audit/* > audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m51-audited-source-not-apk
          path: audit
          retention-days: 7

