name: Audit M51 v8 Source (NO APK)
on:
  push:
    branches: [m51-root-cause-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-v8-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original LibrePods through v8
        shell: bash
        run: |
          set -euo pipefail
          unzip -q LibrePods-M51-v4-pronto-para-compilar.zip -d source
          python3 source/LibrePods-M51-v4/tools/verify-m51-source.py
          python3 scripts/fix-m51-unknown-battery.py source/LibrePods-M51-v4
          python3 scripts/m51-v5-public-ble-preview.py source/LibrePods-M51-v4
          python3 scripts/m51-v6-ble-continuo.py source/LibrePods-M51-v4
          git apply --directory=source/LibrePods-M51-v4 scripts/m51-v7.patch
          python3 scripts/m51-v8-lifecycle-ble.py source/LibrePods-M51-v4
      - name: Apply audited auto-battery and audio fixes (no version bump)
        run: python3 scripts/m51-p0-source-fixes.py source/LibrePods-M51-v4
      - name: Prevent automatic L2CAP spam on rootless Android 12
        run: python3 scripts/m51-p1-l2cap-guard.py source/LibrePods-M51-v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK platform 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run JVM unit tests and compile code (NO APK)
        working-directory: source/LibrePods-M51-v4/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Package reconstructed source for inspection (no binary signing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          tar -C source/LibrePods-M51-v4/android -czf audit/m51-v8-reconstructed-android-source.tar.gz --exclude=build --exclude=.gradle app/src app/build.gradle.kts settings.gradle.kts gradle.properties gradle/libs.versions.toml app/src/main/AndroidManifest.xml
          sha256sum audit/* > audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m51-audited-source-not-apk
          path: audit
          retention-days: 7
