name: Build LibrePods M51 v9 BLE recovery APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - LibrePods-M51-v4-pronto-para-compilar.zip
      - .github/workflows/build-m51-v4-from-zip.yml
      - scripts/**
      - docs/**
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct existing v8 source (shared local/CI script)
        shell: bash
        run: |
          bash -n scripts/materialize-m51-v8.sh
          bash scripts/materialize-m51-v8.sh
      - name: Apply v9 BLE scan recovery (after v8)
        run: python3 scripts/m51-v9-ble-recovery.py source/LibrePods-M51-v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build experimental debug APK
        working-directory: source/LibrePods-M51-v4/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M51-v9-test-reports
          path: source/LibrePods-M51-v4/android/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=source/LibrePods-M51-v4/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p output
          cp "$APK" output/LibrePods-M51-v9-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > output/APK-SIGNATURE.txt
          cp docs/M51-V7.md output/
          cp docs/M51-V8.md output/
          cp docs/M51-V9-EXPERIMENTAL.md output/
          cp scripts/m51-v9-ble-recovery.py output/
          cp scripts/m51-v8-lifecycle-ble.py output/
          cp scripts/m51-v7.patch output/
          (cd output && sha256sum LibrePods-M51-v9-debug.apk > SHA256SUMS.txt)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-M51-v9-BLE-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
